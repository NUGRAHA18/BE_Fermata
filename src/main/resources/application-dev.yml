# DEVELOPMENT profile. Activate with SPRING_PROFILES_ACTIVE=dev.
#
# This profile is what lets the backend run with no broker, no Jetson and no sensors attached, so
# the frontend can be built against a real API before hardware integration is finished.
#
# Devices, sensors and actuators come from the hardware catalog (hardware/fertimata-rev-a.yml), the
# same one the Jetson uses. Only the simulator ranges below are development placeholders: they keep
# the dashboard moving, carry no agronomic meaning, and the backend never interprets them.
app:
  mode: DEVELOPMENT

  # Development-only credentials. Override them with BOOTSTRAP_OPERATOR_* in your .env file.
  # The production profile has no default password at all.
  bootstrap:
    enabled: true
    operator-username: ${BOOTSTRAP_OPERATOR_USERNAME:operator}
    operator-password: ${BOOTSTRAP_OPERATOR_PASSWORD:dev-operator-password}
    operator-full-name: Development Operator

  security:
    jwt:
      # Development-only signing key. Never reuse it anywhere a real token matters.
      secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-every-real-environment}

  websocket:
    # Leave authentication on so the frontend wires up the same CONNECT headers it will need later.
    # Set WEBSOCKET_REQUIRE_AUTHENTICATION=false only if you are debugging the transport itself.
    require-authentication: ${WEBSOCKET_REQUIRE_AUTHENTICATION:true}

  mqtt:
    # false selects the in-memory loopback transport instead of a broker connection.
    # Set MQTT_ENABLED=true to test against the Mosquitto container from docker-compose.
    enabled: ${MQTT_ENABLED:false}

  actuator:
    safety:
      # Visible in /api/dev/outbox so the edge-agent developer sees the field they must honour.
      command-ttl: ${ACTUATOR_COMMAND_TTL:60s}

  dev:
    simulator:
      enabled: ${DEV_SIMULATOR_ENABLED:true}
      interval: ${DEV_SIMULATOR_INTERVAL:10s}
      # PLACEHOLDER ranges for rendering only. Device codes and metric keys match the catalog.
      devices:
        - code: JETSON-01
          # Change to BATTERY through POST /api/dev/devices/JETSON-01/status to exercise the outage path.
          power-source: MAINS
          metrics:
            - { key: trolley.station, min: 0, max: 0, scale: 0 }
            - { key: trolley.home_limit, min: 1, max: 1, scale: 0 }
            - { key: trolley.end_limit, min: 0, max: 0, scale: 0 }
            - { key: jetson.soc_temperature, min: 42, max: 58, scale: 1 }
        - code: PZEM-01
          metrics:
            - { key: mains.voltage, min: 215, max: 228, scale: 1 }
            - { key: mains.frequency, min: 49.9, max: 50.1, scale: 1 }
            - { key: pump.current, min: 0, max: 0, scale: 3 }
            - { key: pump.power, min: 0, max: 0, scale: 1 }
            - { key: pump.energy, min: 1.2, max: 1.3, scale: 3 }
            - { key: pump.power_factor, min: 0, max: 0, scale: 2 }
        - code: PANEL-01
        - code: GREENHOUSE-01
          metrics:
            - { key: soil_a.moisture, min: 55, max: 75, scale: 1 }
            - { key: soil_a.temperature, min: 25, max: 30, scale: 1 }
            - { key: soil_a.ec, min: 900, max: 1600, scale: 0 }
            - { key: soil_a.ph, min: 6.0, max: 6.8, scale: 2 }
            - { key: soil_a.nitrogen, min: 40, max: 90, scale: 0 }
            - { key: soil_a.phosphorus, min: 15, max: 40, scale: 0 }
            - { key: soil_a.potassium, min: 60, max: 140, scale: 0 }
            - { key: soil_b.moisture, min: 55, max: 75, scale: 1 }
            - { key: soil_b.temperature, min: 25, max: 30, scale: 1 }
            - { key: soil_b.ec, min: 900, max: 1600, scale: 0 }
            - { key: soil_b.ph, min: 6.0, max: 6.8, scale: 2 }
            - { key: soil_b.nitrogen, min: 40, max: 90, scale: 0 }
            - { key: soil_b.phosphorus, min: 15, max: 40, scale: 0 }
            - { key: soil_b.potassium, min: 60, max: 140, scale: 0 }
            - { key: air.temperature, min: 26, max: 34, scale: 1 }
            - { key: air.humidity, min: 60, max: 85, scale: 1 }
            - { key: light.illuminance, min: 8000, max: 40000, scale: 0 }
        - code: RIO-TANK-01
          metrics:
            - { key: tank.ec, min: 1.5, max: 2.0, scale: 2 }
            - { key: tank.ph, min: 5.8, max: 6.4, scale: 2 }
            - { key: tank.supply_float, min: 1, max: 1, scale: 0 }
            - { key: tank.mixing_float, min: 1, max: 1, scale: 0 }

logging:
  level:
    com.smartmelon.backend: DEBUG
