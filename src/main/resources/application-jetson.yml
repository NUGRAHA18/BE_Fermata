# JETSON profile: the FERTIMATA Rev A deployment. Activate with SPRING_PROFILES_ACTIVE=jetson.
#
# Everything runs on one Jetson Orin Nano 8GB: frontend, this backend, PostgreSQL, the vision model
# and the edge agent that speaks Modbus/GPIO. The settings below reflect that - a local broker, a
# small connection pool, and stricter command handling because the actuators are real.
#
# It is still PRODUCTION mode: JWT_SECRET and the operator password have no defaults here either.

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/smartmelon}
    hikari:
      # The database shares 8 GB with inference; a small pool is plenty for one site.
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}

server:
  # The dashboard is reached through Cloudflare Tunnel; honour X-Forwarded-* from the local proxy.
  forward-headers-strategy: framework

app:
  device:
    # The catalog provisions every device. An unknown device code is a misconfigured agent, not a
    # new greenhouse, so its messages are recorded as REJECTED rather than inventing a device.
    auto-register: ${DEVICE_AUTO_REGISTER:false}

  telemetry:
    # Still on: an unknown metric becomes a disabled placeholder sensor, so data is kept for review.
    auto-register-sensors: ${TELEMETRY_AUTO_REGISTER_SENSORS:true}

  actuator:
    safety:
      # A persistent MQTT session would otherwise deliver a queued "ON" whenever a device returns.
      refuse-when-device-offline: ${ACTUATOR_REFUSE_WHEN_DEVICE_OFFLINE:true}
      command-ttl: ${ACTUATOR_COMMAND_TTL:30s}

  mqtt:
    enabled: ${MQTT_ENABLED:true}
    # Mosquitto on the same board, bound to loopback only. Nothing outside the Jetson needs MQTT.
    broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
