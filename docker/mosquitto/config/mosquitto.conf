# DEVELOPMENT broker configuration.

# Anonymous access is enabled so the stack starts with no extra setup. That is acceptable on a
# developer machine and NOT acceptable anywhere else: a production broker must require credentials
# and TLS, and the backend reads those from MQTT_USERNAME / MQTT_PASSWORD / MQTT_BROKER_URL.

listener 1883
allow_anonymous true #warning

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
